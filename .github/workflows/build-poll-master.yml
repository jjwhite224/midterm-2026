name: Build 2026 congressional poll master dataset
on:
  push:
    branches: [main]
    paths:
      - 'analysis/build_poll_master.py'
      - '.github/workflows/build-poll-master.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build attributed poll master and audit
        run: |\n          python analysis/build_poll_master.py\n          python analysis/enrich_poll_candidates.py
      - name: Save generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026_congressional_poll_master.csv analysis/2026_poll_master_audit.json analysis/2026_congressional_poll_master_with_candidates.csv analysis/2026_candidate_enrichment_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: build attributed congressional polling master'
            git push
          fi
