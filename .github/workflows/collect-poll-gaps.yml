name: Audit supplemental 2026 congressional polls
on:
  push:
    branches: [main]
    paths:
      - 'analysis/collect_supplemental_candidates.py'
      - '.github/workflows/collect-poll-gaps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates from public source
        run: python analysis/collect_supplemental_candidates.py
      - name: Commit review data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/supplemental_poll_candidates_REVIEW.csv analysis/supplemental_poll_source_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: review queue for supplemental congressional polls'
            git push
          fi
